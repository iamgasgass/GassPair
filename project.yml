name: GassPair
options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.3.2"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  GassPair:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - framework: GassPairFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gasspair
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
