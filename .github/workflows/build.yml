name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Run RPPairing FFI integration tests
        run: |
          python3 tools/test-rp-endpoint-integration.py
          python3 tools/test-rp-import-integration.py
          python3 tools/test-rp-lockdown-trust-integration.py
          python3 tools/test-rp-service-transport-diagnostics.py
          python3 tools/test-usbmuxd-companion-integration.py

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust unit tests (integrated companion)
        run: cargo test --manifest-path rust/Cargo.toml --lib

      - name: Build Rust FFI xcframework
        run: ./build-rust.sh

      - name: Build macOS usbmuxd companion
        run: cargo build --release --manifest-path companion/Cargo.toml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project GassPair.xcodeproj \
            -scheme GassPair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/GassPair.app"
          rm -rf build/Payload GassPair.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          find build/Payload -name '.DS_Store' -delete
          (cd build && zip -qr ../GassPair.ipa Payload)
          ls -lh GassPair.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: GassPair-unsigned
          path: GassPair.ipa
          if-no-files-found: error

      - name: Upload macOS companion artifact
        uses: actions/upload-artifact@v7
        with:
          name: gasspair-usbmuxd-companion-macos
          path: companion/target/release/gasspair-usbmuxd-companion
          if-no-files-found: error

      - name: Attach IPA and macOS companion to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            GassPair.ipa
            companion/target/release/gasspair-usbmuxd-companion
