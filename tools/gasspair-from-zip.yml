# Build GassPair on GitHub straight from GassPair.zip — no computer needed.
#
# 1. In an (empty) GitHub repo: Add file › Upload files › GassPair.zip  (repo root)
# 2. Add file › Create new file, name it  .github/workflows/gasspair-from-zip.yml
#    and paste this whole file. Commit.
# 3. The build starts by itself (or Actions › "GassPair build from zip" › Run workflow).
#    When it's green, the IPA is attached to a new Release (and to the run's artifacts).
name: GassPair build from zip

on:
  push:
    paths:
      - "GassPair.zip"
      - ".github/workflows/gasspair-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gasspair-from-zip
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Unpack GassPair.zip
        run: |
          set -euo pipefail
          test -f GassPair.zip || { echo "Upload GassPair.zip to the repository root first."; exit 1; }
          rm -rf /tmp/gp && mkdir -p /tmp/gp
          unzip -q GassPair.zip -d /tmp/gp
          SRC=/tmp/gp
          [ -d /tmp/gp/GassPair ] && SRC=/tmp/gp/GassPair
          rm -rf gasspair-src && cp -a "$SRC" gasspair-src
          ls gasspair-src

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen

      - name: Build Rust FFI xcframework
        working-directory: gasspair-src
        run: ./build-rust.sh

      - name: Generate Xcode project
        working-directory: gasspair-src
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: gasspair-src
        run: |
          xcodebuild \
            -project GassPair.xcodeproj \
            -scheme GassPair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        working-directory: gasspair-src
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/GassPair.app"
          rm -rf build/Payload GassPair.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          find build/Payload -name '.DS_Store' -delete
          (cd build && zip -qr ../GassPair.ipa Payload)
          ls -lh GassPair.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: GassPair-unsigned
          path: gasspair-src/GassPair.ipa
          if-no-files-found: error

      - name: Publish IPA as a release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gasspair-build-${{ github.run_number }}
          name: GassPair build ${{ github.run_number }}
          files: gasspair-src/GassPair.ipa
