[package]
name = "gasspair_ffi"
version = "0.3.4"
edition = "2021"
description = "GassPair: C FFI shim over idevice's on-device wireless pairing (iOS 27 pairable host + Apple TV)"

[lib]
name = "gasspair_ffi"
crate-type = ["staticlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "26a28f6a46b5d85a28043c2e62febfa394c8b0a6", default-features = false, features = [
  "remote_pairing",
  "tcp",
  "aws-lc",
] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time", "sync", "io-util"] }
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
opt-level = 3
lto = "thin"
# Panics must unwind so they are caught at the FFI boundary instead of
# aborting the whole app.
panic = "unwind"
