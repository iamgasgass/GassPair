[package]
name = "gasspair-usbmuxd-companion"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "Authenticated macOS companion for creating and verifying iPhone RPPairing over usbmuxd"
license = "MIT"

[[bin]]
name = "gasspair-usbmuxd-companion"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "26a28f6a46b5d85a28043c2e62febfa394c8b0a6", default-features = false, features = ["remote_pairing", "tcp", "usbmuxd", "aws-lc"] }
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "signal"] }
uuid = { version = "1.12", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
